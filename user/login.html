<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="icon" href="../../img/Logo_Sabana1.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="top-right-toggle">
      <a href="javascript:history.back()" class="back-btn" title="Kembali ke halaman awal">
        <i class="fa-solid fa-arrow-left"></i>
        <span class="sr-only">Kembali</span>
      </a>
    </div>

    <div class="mode-badge">LOGIN SISTEM</div>

    <div class="left-panel">
      <div class="logo">
        <div class="logo-icon"></div>
        <div class="logo-text">Sabana<br>Fried Chicken</div>
      </div>

      <div class="avatar">
        <i class="fa-solid fa-user-lock"></i>
      </div>

      <div class="form-title">MASUK KE AKUN</div>

      <div class="alert" id="alertBox"></div>

      <form id="loginForm" action="process/login.php" method="POST" onsubmit="return handleLogin(event)">
        
        <div class="input-group">
          <i class="fa-solid fa-envelope left-icon"></i>
          <input type="email" name="email" id="loginEmail" placeholder="EMAIL" required>
        </div>

        <div class="input-group password-group">
          <i class="fa-solid fa-lock left-icon"></i>
          <input type="password" name="password" id="loginPassword" placeholder="PASSWORD" required>
          <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
        </div>

        <button type="submit" class="login-btn">LOGIN</button>

        <div class="form-footer">
          <label class="remember">
            <input type="checkbox" name="remember"> Remember me
          </label>
          <a href="https://www.instagram.com/effrizal_17/" target="_blank">Forgot your password?</a>
        </div>

        <div class="switch-form">
          Belum punya akun?
          <a href="register.html">Daftar di sini</a>
        </div>
      </form>
    </div>

    <div class="right-panel">
      <div class="welcome-content">
        <h1>Welcome.</h1>
        <p>Selamat datang di Sabana Fried Chicken. Silakan masuk untuk melakukan pemesanan atau mengelola sistem.</p>
      </div>  
    </div>
  </div>

  <script src="js/script-user.js"></script>
</body>
</html>
